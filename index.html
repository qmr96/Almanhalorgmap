.details{overscroll-behavior:contain}.details h2{font-size:19px;margin:0 0 8px}.details .source{font-size:11px;color:#91a0ba;margin:4px 0 14px}.details h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#8292ad;margin:18px 0 7px}

<div class="app">

        </defs>
      </svg>
    </div>
  </div>

</div>
</div>

  </div>
  <div class="modal-actions"><button class="btn" id="cancelEdit">Cancel</button><button class="btn" id="clearEdit">Clear overlay</button><button class="btn active" id="saveEdit">Save</button></div>
</div></div>

function nodeSize(){return innerWidth<=700?190:210}
function anchor(n,target){
  const w=n._w||nodeSize(),h=n._h||82; const A={x:n.x,y:n.y,w,h},B={x:target.x,y:target.y,w:target._w||nodeSize(),h:target._h||82};
  const ax=A.x+A.w/2, ay=A.y+A.h/2, bx=B.x+B.w/2, by=B.y+B.h/2;
  if(Math.abs(bx-ax)>=Math.abs(by-ay)) return bx>=ax?{x:A.x+A.w,y:ay,side:'r'}:{x:A.x,y:ay,side:'l'};
  return by>=ay?{x:ax,y:A.y+A.h,side:'b'}:{x:ax,y:A.y,side:'t'};
}
function route(a,b){
  const A=anchor(a,b),B=anchor(b,a), gap=28;
  if((A.side==='r'||A.side==='l')&&(B.side==='r'||B.side==='l')){const mid=(A.x+B.x)/2;return `M ${A.x} ${A.y} H ${mid} V ${B.y} H ${B.x}`;}
  if((A.side==='t'||A.side==='b')&&(B.side==='t'||B.side==='b')){const mid=(A.y+B.y)/2;return `M ${A.x} ${A.y} V ${mid} H ${B.x} V ${B.y}`;}
  const mx=A.side==='r'?A.x+gap:A.side==='l'?A.x-gap:A.x; const my=B.side==='b'?B.y+gap:B.side==='t'?B.y-gap:B.y;
  if(A.side==='r'||A.side==='l') return `M ${A.x} ${A.y} H ${mx} V ${B.y} H ${B.x}`;
  return `M ${A.x} ${A.y} V ${my} H ${B.x} V ${B.y}`;
}

}

}
function openEditor(id){
  state.editing=id; const n=byId(id)||nodeFromGap(DATA.gaps.find(g=>g.id===id)||{}); const u=userOverlay(id)||{};
  document.getElementById('editorTitle').textContent='Edit / Fill Gap — '+(n?.label||id);
  document.getElementById('editorSubtitle').textContent=`V1 remains unchanged. Your entry is stored as a separate overlay. Source: §${n?.section?.replace('s','')} · p.${n?.page}`;
  document.getElementById('editStatus').value=u.status||'open';document.getElementById('editOwner').value=u.owner||'';document.getElementById('editInfo').value=u.info||'';document.getElementById('editEvidence').value=u.evidence||'';document.getElementById('editNotes').value=u.notes||'';
  editorModal.classList.add('open');editorModal.setAttribute('aria-hidden','false');setTimeout(()=>document.getElementById('editInfo').focus(),50);
}
function closeEditor(){state.editing=null;editorModal.classList.remove('open');editorModal.setAttribute('aria-hidden','true')}
document.getElementById('saveEdit').onclick=()=>{if(!state.editing)return;USER[state.editing]={status:editStatus.value,owner:editOwner.value,info:editInfo.value,evidence:editEvidence.value,notes:editNotes.value,updated:new Date().toISOString()};saveUser();closeEditor();render()};
document.getElementById('clearEdit').onclick=()=>{if(!state.editing)return;delete USER[state.editing];saveUser();closeEditor();render()};
document.getElementById('cancelEdit').onclick=closeEditor;
editorModal.addEventListener('click',e=>{if(e.target===editorModal)closeEditor()});
function coverageStatus(){
  return DATA.sections.map(s=>{
    const nodeHit=DATA.nodes.some(n=>n.section===s.id);
    const gapHit=DATA.gaps.some(g=>g.section===s.id);
    return {id:s.id,ok:nodeHit||gapHit,nodeHit,gapHit};
  });
}
function renderSidebar(){
  const sb=document.getElementById('sidebar');
  const views=[
    ['group','⌂ Group Map'],['depot','Pharmaceutical Depot'],['scientific','Scientific Office'],
    ['pharmacies','4 Pharmacies'],['finance','Finance / Treasury'],['gym','Gym'],['restaurant','Boulevard Restaurant'],
    ['turkey','Turkey Arrangement'],['organization','Organization / Governance'],['flows','End-to-End Flows'],
    ['tobe','TO-BE Model'],['gaps','GAP Register']
  ];
  sb.innerHTML=`<div class="side-title">Maps</div>`+views.map(([id,label])=>`<button class="nav-item ${state.view===id?'active':''}" onclick="setView('${id}')">${label}</button>`).join('')+
    `<div class="side-title">Traceability</div><div class="mode-note">${DATA.source}<br>${DATA.version}<br><br>All 16 sections represented below. V1 gaps are not inferred as absence.</div>
    <div class="side-title">Flow Legend</div><div class="legend">
      <div><span class="dot" style="background:var(--material)"></span>Material / Product</div>
      <div><span class="dot" style="background:var(--money)"></span>Money</div>
      <div><span class="dot" style="background:var(--information)"></span>Information</div>
      <div><span class="dot" style="background:var(--authority)"></span>Authority</div>
      <div><span class="dot" style="background:var(--system)"></span>System / Data</div>
      <div><span class="dot" style="background:var(--gap)"></span>Gap</div>
    </div>
    <div class="side-title">16-Section Coverage</div><div class="coverage">${DATA.sections.map(s=>{const c=coverageStatus().find(x=>x.id===s.id);return `<div class="sec ${c.ok?'ok':'gap'}" title="${esc(DATA.section_notes[s.id])}">§${s.n} ${esc(s.title)} · ${c.ok?'✓':'GAP'}</div>`}).join('')}</div>
    <div class="side-title">Gap Count</div><div class="mode-note"><b>${DATA.gaps.length}</b> explicit GAP records captured from V1, plus the broader gap categories in §15.</div>`;
}
function openSectionMap(sec){
  const map={'s3':'depot','s4':'scientific','s5':'pharmacies','s6':'finance','s7':'gym','s8':'restaurant','s9':'turkey','s10':'organization','s11':'flows','s13':'tobe','s15':'gaps'};
  setView(map[sec]||'group');
}
document.getElementById('homeBtn').onclick=()=>setView('group');
document.getElementById('backBtn').onclick=()=>{if(state.history.length){state.view=state.history.pop();state.selected=null;render()}};
document.getElementById('mode').onchange=e=>{state.mode=e.target.value;state.view=state.mode==='gaps'?'gaps':state.mode==='tobe'?'tobe':'group';state.selected=null;render()};
document.getElementById('typeFilter').onchange=e=>{state.type=e.target.value;render()};
document.getElementById('search').oninput=e=>{state.query=e.target.value;render()};
document.getElementById('detailsBtn').onclick=()=>details.classList.toggle('open');
document.getElementById('dataBtn').onclick=()=>{const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(USER,null,2));a.download='NAEL_V1_user_updates.json';a.click()};

function applyTransform(){world.style.transform=`translate(${state.tx}px,${state.ty}px) scale(${state.scale})`;document.getElementById('zoomReset').textContent=Math.round(state.scale*100)+'%'}
function fitMap(){const ns=[...world.querySelectorAll('.node')];if(!ns.length)return;const vw=viewport.clientWidth,vh=viewport.clientHeight;const minX=Math.min(...ns.map(e=>parseFloat(e.style.left))),minY=Math.min(...ns.map(e=>parseFloat(e.style.top))),maxX=Math.max(...ns.map(e=>parseFloat(e.style.left)+e.offsetWidth)),maxY=Math.max(...ns.map(e=>parseFloat(e.style.top)+e.offsetHeight));const pad=45;const sx=(vw-pad*2)/(maxX-minX),sy=(vh-pad*2)/(maxY-minY);state.scale=Math.max(.22,Math.min(1.25,sx,sy));state.tx=(vw-(maxX+minX)*state.scale)/2;state.ty=(vh-(maxY+minY)*state.scale)/2;applyTransform()}
document.getElementById('zoomIn').onclick=()=>{state.scale=Math.min(2.5,state.scale*1.18);applyTransform()};
document.getElementById('zoomOut').onclick=()=>{state.scale=Math.max(.22,state.scale/1.18);applyTransform()};
document.getElementById('zoomReset').onclick=()=>{state.scale=1;state.tx=40;state.ty=40;applyTransform()};
document.getElementById('fitBtn').onclick=fitMap;
let dragging=false,sx=0,sy=0,ox=0,oy=0,pointers=new Map(),pinchStart=0,pinchScale=1;
viewport.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,e);if(e.target.closest('.node')&&pointers.size===1)return;if(pointers.size===1){dragging=true;viewport.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=state.tx;oy=state.ty}if(pointers.size===2){dragging=false;const ps=[...pointers.values()];pinchStart=Math.hypot(ps[0].clientX-ps[1].clientX,ps[0].clientY-ps[1].clientY);pinchScale=state.scale}});
viewport.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,e);if(pointers.size===2){const ps=[...pointers.values()];const d=Math.hypot(ps[0].clientX-ps[1].clientX,ps[0].clientY-ps[1].clientY);state.scale=Math.max(.22,Math.min(2.5,pinchScale*(d/pinchStart)));applyTransform();return}if(!dragging)return;state.tx=ox+(e.clientX-sx);state.ty=oy+(e.clientY-sy);applyTransform()});
function endPointer(e){pointers.delete(e.pointerId);dragging=false;if(viewport.hasPointerCapture(e.pointerId))viewport.releasePointerCapture(e.pointerId)}viewport.addEventListener('pointerup',endPointer);viewport.addEventListener('pointercancel',endPointer);
viewport.addEventListener('wheel',e=>{e.preventDefault();state.scale=Math.max(.45,Math.min(2.2,state.scale*(e.deltaY<0?1.08:.92)));applyTransform()},{passive:false});

window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(editorModal.classList.contains('open'))closeEditor();else{state.selected=null;details.classList.remove('open');render()}} if(e.key==='+'||e.key==='='){state.scale=Math.min(2.2,state.scale*1.15);applyTransform()} if(e.key==='-'){state.scale=Math.max(.45,state.scale/1.15);applyTransform()}});
render();applyTransform();setTimeout(fitMap,50);
</script>
</body>
</html>
